<!DOCTYPE html>

<html>

<head>
  <title>Solitario VIU</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
  <!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! **/
		Invocar a los ficheros de estilos y al JavaScript donde proceda
        -->
  <link rel="stylesheet" href="css/solitario.css" />
</head>

<body>
  <div class="central">
    <!-- Título principal -->

    <!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! **/
			Rellenar h1 e insertar el logo donde proceda
        	-->
    <div class="header-container">
      <h1 id="titulo">Juego del solitario</h1>
      <img src="imagenes/logoVIU.png" alt="Logo VIU" class="logo" />
    </div>

    <!-- Siguiente línea donde se indicará el tiempo transcurrido y la cantidad
				de movimientos que se han hecho hasta el momento. Estos números se 
				indicarán en los span internos -->
    <h2 id="marcadores">
      <span>Tiempo: <span id="contador_tiempo">00:00:00</span></span>
      <span style="display: inline-block; width: 200px"></span>
      <span>Movimientos: <span id="contador_movimientos">0</span></span>
    </h2>

    <!-- La "mesa" contendrá los 6 tapetes. En la parte superior dos de ellos 
				y en la parte inferior los cuatro restantes. Los contadores de los
				mazos de cartas de cada tapete están indicados oportunamente dentro
				de elementos span -->
        <div id="mesa">
          <div class="tapetes_superiores">
              <div id="inicial" class="tapete">
                  <span class="contador">48</span>
              </div>
              <div id="sobrantes" class="tapete">
                  <span class="contador">0</span>
              </div>
          </div>
          <div id="receptor1" class="tapete receptor">
              <span class="contador">0</span>
          </div>
          <div id="receptor2" class="tapete receptor">
              <span class="contador">0</span>
          </div>
          <div id="receptor3" class="tapete receptor">
              <span class="contador">0</span>
          </div>
          <div id="receptor4" class="tapete receptor">
              <span class="contador">0</span>
          </div>
      </div>
      

      <div id="popupFinJuego" class="popup">
        <p>¡Juego terminado!</p>
        <p>Duración: <span id="tiempoDuracion">00:00:00</span></p> <!-- Aquí se mostrará el tiempo -->
        <button id="cerrarPopup" class="btn btn-danger">Cerrar</button>
        <button id="reiniciarJuego" class="btn btn-primary">Reiniciar Juego</button>
      </div>
      



    <!-- Botón de reset que reinicia todo: partida, contadores de tiempo, de movimientos, ... -->
    <button id="reset" class="btn btn-danger">Reiniciar</button>
  </div>
  <!-- class="central" -->

  <script src="js/solitario.js"></script>
</body>

</html>
